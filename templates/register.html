{% extends "base.html" %}
{% block title %}Sign up — Alpine Alpaca{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Create your account</h2>
    <form method="POST">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required autofocus><br><br>

        <label for="password">Password (10+ characters)</label>
        <input type="password" name="password" id="password" minlength="10" required><br><br>

        <label for="confirm">Confirm password</label>
        <input type="password" name="confirm" id="confirm" minlength="10" required><br><br>

        <button type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
